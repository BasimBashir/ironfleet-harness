[project]
name = "harness"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.6", "httpx>=0.27", "keyring>=24", "pyyaml>=6", "pypdf>=6.0", "sqlite-vec==0.1.9", "apsw>=3.46; sys_platform == 'darwin'", "pywebview>=5; sys_platform == 'darwin'", "markitdown>=0.1", "textual>=3.0", "fastapi==0.162.2", "uvicorn==0.54.0"]

[project.scripts]
harness = "harness.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24.0", "playwright==1.64.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
