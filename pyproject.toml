[project]
name = "harness"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.6", "httpx>=0.27", "keyring>=24", "pyyaml>=6"]

[project.scripts]
harness = "harness.cli_stub:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
