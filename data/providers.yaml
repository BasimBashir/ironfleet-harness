# data/providers.yaml — the provider registry as data (R3, 2026-10-19)
#
# One row per provider is the WHOLE bundle: base_url + model + engine + kind. The
# routing table (data/routing-a1.yaml) only NAMES providers per task class, so
# changing which provider serves a class — or swapping a provider's model entirely —
# is a data edit here, never a code edit. The URL travels with the provider by
# construction (user directive 2026-10-19: "when provider and model needs change by
# user then ofcourse target url will also change according to provider").
#
# Registration is still by EVIDENCE, never by trust: bootstrap._probe_ollama probes
# every row below through harness.providers.probe.register_provider (reachable +
# authed + CR-3 provenance) and an unverifiable cloud row REFUSES. Editing this file
# changes what gets probed, not what gets trusted.
#
# Env overrides (quick swaps with no file edit): IRONFLEET_<NAME>_URL / _MODEL /
# _REVISION, e.g. IRONFLEET_NVIDIA_NIM_MODEL=moonshotai/kimi-k2...
#
# Optional per-row fields the R3 shell uses:
#   context_window — the model's context size (user-declared; drives the shell's
#                    used-vs-remaining meter and auto-/compact, D-T3).
#   safe_fill      — the fraction of that window at which auto-/compact fires,
#                    derived from the model's measured reliability, not a round
#                    number (default 0.8).
#   weights_revision — the declared provenance pin the probe's verified rule uses.
# tier: local | cloud. LOCAL_ONLY_TASKS (embedding, rerank, policy.py) can never
# route to a cloud row, whatever the routing table says — structural, adversarial-tested.

providers:
  - name: ollama-local
    base_url: http://127.0.0.1:11434/v1
    model: thomson1-chat:latest
    engine: ollama
    kind: chat
    tier: local
    # Ollama's executed backend is unverifiable (CR-3): it admits mechanical-only,
    # so policy.MECHANICAL_TASKS bounds what it may serve. That is honest, not a defect.

  - name: ollama-embed
    base_url: http://127.0.0.1:11434/v1
    model: bge-m3:567m
    engine: ollama
    kind: chat
    tier: local

  - name: qwen-local
    base_url: http://127.0.0.1:11434/v1
    model: qwen3.8:27b
    engine: ollama
    kind: chat
    tier: local
    # The tool-calling leg (S7j-W). Kept as a row so a no-network fallback exists
    # even though routing now prefers nvidia-nim for toolpath.

  - name: llama-rerank
    base_url: http://127.0.0.1:8778
    model: qwen3-reranker-0.6b
    engine: llamacpp
    kind: rerank
    tier: local

  # The cloud tier that clears CR-3 fully: engine=cloud reports declared revision +
  # saas backend, so it admits as full and may serve the non-mechanical classes
  # Ollama's mechanical-only verdict may not.
  - name: nvidia-nim
    base_url: https://integrate.api.nvidia.com/v1
    model: nvidia/nemotron-3.5-super-vl-120b-a12b
    engine: cloud
    kind: chat
    tier: cloud
    # NIM reports no weights revision of its own; the declared value IS the pin
    # (provenance.revision_verified + S7h's carry-forward at dispatch).
    # User directive 2026-10-20: nemotron-3.5-super-vl is THE NIM cloud model.
    weights_revision: nvidia/nemotron-3.5-super-vl-120b-a12b
    # D-T3 (2026-10-19): the user-declared context window for the R3 shell's
    # used-vs-remaining display and auto-/compact. SET THIS when you swap models —
    # the number the provider documents for the model you put in `model:` above.
    context_window: 128000
    # Reliability-aware safe fill (D-T3): the fraction of context_window at which
    # auto-/compact fires. NOT a fixed percentage in code — derived from the
    # model's MEASURED behaviour on this box (S7h: empty-content cap failures,
    # mid-generation deaths on buffered POSTs, reasoning-token burn), so the
    # session uses the maximum of the window SAFELY. Default 0.8 until measured.
    safe_fill: 0.8

  # The toolpath leg's cloud row. Deliberately a DIFFERENT model from nvidia-nim:
  # S7j-W 1.2 disjointness — research (parity's leg) and toolpath (the injection
  # class) must never share a candidate, and research needs nvidia-nim (step-5) for
  # its cloud leg. Same NIM endpoint; the keychain key is the ROW NAME, so seed it
  # from nvidia-nim's (one-time: see research/R3-TUI-RUNBOOK.md section 9).
  - name: nvidia-nim-tool
    base_url: https://integrate.api.nvidia.com/v1
    model: nvidia/nemotron-3.5-super-vl-120b-a12b
    engine: cloud
    kind: chat
    tier: cloud
    # Same model as nvidia-nim (user directive 2026-10-20: "everywhere") — the
    # toolpath/research disjointness still holds because it is asserted by ROW
    # NAME, but the two rows now share one model; the injection proof and the
    # parity leg therefore ride the same weights.
    weights_revision: nvidia/nemotron-3.5-super-vl-120b-a12b
    # SET THIS to the catalog value for whatever model you put in `model:` above —
    # the shell's meter and auto-/compact read it (D-T3).
    context_window: 128000
    safe_fill: 0.8
