# data/module-e/tools.yaml — the tool surface S7c exposes to OpenCode (spec §3.5)
# status:  ported   = wired and tested this cycle
#          deferred = named for the S7c batch task; a persona may reference it — the generator
#                     records it in a `# deferred` ledger in the agent file rather than enabling
#                     a tool ID that does not exist
#          blocked  = dependency cannot be satisfied without the old tree
# source:  path in ..\IronFleet\legalai (provenance for review)
# aliases: old kernel names — the 6 kernels are 13-line re-export shims INTO these skills, so a
#          kernel is an alias on a skill row, never a row of its own.
tools:
  - name: ironfleet_statutory_demand
    description: "Validate a statutory demand under s 289 Companies Act 1993 and compute the
                  s 241(4)(a) compliance deadline"
    entry: harness.module_e.kernel_tools:statutory_demand
    status: ported
    source: skills/nz-statutory-demand-validator/scripts/companies_act.py
    aliases: [companies_act]

  - name: ironfleet_without_prejudice
    description: "Detect without-prejudice correspondence and privilege markers in text"
    entry: harness.module_e.kernel_tools:without_prejudice
    status: ported
    source: skills/without-prejudice-detector/scripts/without_prejudice_detector.py

  - name: route
    description: "Resolve which specialist personas handle this matter and in what order"
    entry: harness.module_e.supervisor:route_tool
    status: ported
    source: orchestration/supervisor.py

  - name: refine_output
    description: "Critique and improve a draft through the gate (self-refine loop)"
    entry: harness.module_e.refine:refine_tool
    status: ported
    source: helpers/self_refine.py

