# data/module-e/personas.yaml — the S7c persona index
#
# Bodies: `primary`/`variants` point into `_source/`, byte-for-byte transcriptions of the old
# tree (see PROVENANCE.md). Task 1 transcribed `allowed_tools`/`denied_tools` verbatim from the
# old `config.yaml` files; Task 10 reconciled both lists against the tool manifest
# (`tools.yaml`), because a persona advertising an old-tree name this mount does not have would
# be a silent capability lie. Every disposition — mapped, dropped, or removed-from-denied — is
# recorded in PROVENANCE.md with its reason; nothing below is an unexplained residue.
#
# Result: auditor carries one ported reference (`ironfleet_statutory_demand`, which the generator
# writes as `tools: {…: true}`) plus five deferred rows in its `# deferred` ledger;
# negotiator, strategist and wargamer each carry one deferred reference
# (`ironfleet_limitation_act`, the deferred form of the `limitation_checker` they allowed in the
# old configs); every other persona carries no tool reference at all. Exactly one persona gains an
# ENABLED tool — a measured fact, not a failure.
personas:
  - name: adversary
    description: "Red team critique — finds weaknesses, recommends KILL if unwinnable"
    task_type: complex_reasoning
    primary: _source/adversary.txt
    variants: {}
    allowed_tools: []
    denied_tools: [file_write, web_scrape, shell_exec]

  - name: ambiguity
    description: "Query complexity detector — LOW/MEDIUM/HIGH assessment before routing"
    task_type: classification
    primary: _source/ambiguity.txt
    variants: {}
    allowed_tools: []
    denied_tools: [file_write, web_scrape, shell_exec]

  - name: architect
    description: "State management — Case Vault persistence, session continuity, state baton"
    task_type: summarization
    primary: _source/architect.txt
    variants: {}
    allowed_tools: []
    denied_tools: [web_scrape, shell_exec]

  - name: auditor
    description: "Calculation specialist — all math via statutory kernel code only"
    task_type: summarization
    primary: _source/auditor.txt
    variants: {}
    allowed_tools:
      - ironfleet_statutory_demand
      - ironfleet_solvency_assessor
      - ironfleet_penalty_clause
      - ironfleet_imca_2016
      - ironfleet_limitation_act
      - ironfleet_security_interest
    denied_tools: [web_search, web_scrape, file_write, shell_exec]

  - name: citation
    description: "Formats citations in legal documents using Iron Fleet's standard format, renders PDF page snippets, and enables bi-directional source highlighting."
    task_type: drafting
