# data/routing-a1.yaml — the A-1 routing table (S7b)
# The gate/* aliases are the model catalog OpenCode sees; each maps to a task class.
# Empty defaults: an unrecognised task class has no candidates and REFUSES. Every class
# the harness uses must be listed explicitly — that is the fail-closed contract.
aliases:
  gate/embedding:         {task_class: embedding}
  gate/extraction:        {task_class: extraction}
  gate/classification:    {task_class: classification}
  gate/redaction:         {task_class: redaction}
  gate/grounding_check:   {task_class: grounding_check}
  gate/drafting:          {task_class: drafting}
  gate/research:          {task_class: research}
  gate/analysis:          {task_class: analysis}
  gate/complex_reasoning: {task_class: complex_reasoning}
  gate/summarization:     {task_class: summarization}
  # S7j-W spec §1: the fail-closed injection leg's class — the ONLY class qwen-local
  # serves, so parity (research -> ollama-local) and injection never share a candidate.
  gate/toolpath:           {task_class: toolpath}
  gate/rerank:             {task_class: rerank}
rules:
  - task_class: extraction
    local_only: [ollama-local]
    local_preferred: [ollama-local]
    cloud_permitted: [ollama-local]
  - task_class: classification
    local_only: [ollama-local]
    local_preferred: [ollama-local]
    cloud_permitted: [ollama-local]
  - task_class: redaction
    local_only: [ollama-local]
    local_preferred: [ollama-local]
    cloud_permitted: [ollama-local]
  - task_class: grounding_check
    local_only: [ollama-local]
    local_preferred: [ollama-local]
    cloud_permitted: [ollama-local]
  # R3 2026-10-19: the non-mechanical classes route to the cloud tier. On this box Ollama
  # is honestly mechanical-only (CR-3: its executed backend is unverifiable), so these
  # classes REFUSED entirely until a provider with verifiable provenance serves them —
  # nvidia-nim (stepfun-ai/step-5-preview) is that provider (bootstrap._probe_ollama).
  # Local candidates stay listed: when a box runs a verifiable local engine (llama-server
  # /props.build_info, mlx-lm /health) they route again with no YAML edit.
  - task_class: drafting
    local_only: [ollama-local, nvidia-nim]
    local_preferred: [ollama-local, nvidia-nim]
    cloud_permitted: [nvidia-nim, ollama-local]
  - task_class: research
    # R3: research is parity's leg and must NEVER share a candidate with the toolpath
    # injection class (S7j-W §1.2) — hence no nvidia-nim in cloud_permitted. On a
    # mechanical-only box research then honestly REFUSES unless the matter is cloud_
    # permitted; the drafting/analysis legs (no disjointness duty) carry NIM.
    local_only: [ollama-local, nvidia-nim]
    local_preferred: [ollama-local, nvidia-nim]
    cloud_permitted: [ollama-local]
  - task_class: analysis
    local_only: [ollama-local, nvidia-nim]
    local_preferred: [ollama-local, nvidia-nim]
    cloud_permitted: [nvidia-nim, ollama-local]
  - task_class: complex_reasoning
    local_only: [ollama-local, nvidia-nim]
    local_preferred: [ollama-local, nvidia-nim]
    cloud_permitted: [nvidia-nim, ollama-local]
  - task_class: summarization
    local_only: [ollama-local, nvidia-nim]
    local_preferred: [ollama-local, nvidia-nim]
    cloud_permitted: [nvidia-nim, ollama-local]
  - task_class: embedding
    local_only: [ollama-embed]
    local_preferred: [ollama-embed]
    cloud_permitted: [ollama-embed]
  # S7j-W: the tool-calling injection model. NOT mechanical on purpose — Ollama's honest
  # mechanical-only verdict must not silently serve it; the recorded in-memory override
  # admits it, keeping the CR-3 deviation visible.
  # R3 2026-10-19: the tool-calling injection leg. NIM (step-5) is a full-admission
  # tool-calling cloud model, so it leads; qwen-local stays listed — with NIM down the
  # leg degrades to the recorded in-memory-override precedent (S7j-W) instead of dying.
  - task_class: toolpath
    local_only: [qwen-local, nvidia-nim]
    local_preferred: [qwen-local, nvidia-nim]
    cloud_permitted: [nvidia-nim, qwen-local]
  # R1 D3: the cross-encoder rerank class — structurally LOCAL_ONLY (policy.py) and
  # mechanical; served by llama-server --reranking on this box (research/06 recipe).
  - task_class: rerank
    local_only: [llama-rerank]
    local_preferred: [llama-rerank]
    cloud_permitted: [llama-rerank]
defaults:
  local_only: []
  local_preferred: []
  cloud_permitted: []
