# data/routing-a1.yaml — the A-1 routing table (S7b)
# The gate/* aliases are the model catalog OpenCode sees; each maps to a task class.
# Empty defaults: an unrecognised task class has no candidates and REFUSES. Every class
# the harness uses must be listed explicitly — that is the fail-closed contract.
aliases:
  gate/extraction:      {task_class: extraction}
  gate/classification:  {task_class: classification}
  gate/redaction:       {task_class: redaction}
  gate/grounding_check: {task_class: grounding_check}
  gate/drafting:        {task_class: drafting}
rules:
  - task_class: extraction
    local_only: [ollama-local]
    local_preferred: [ollama-local]
    cloud_permitted: [ollama-local]
  - task_class: classification
    local_only: [ollama-local]
    local_preferred: [ollama-local]
    cloud_permitted: [ollama-local]
  - task_class: redaction
    local_only: [ollama-local]
    local_preferred: [ollama-local]
    cloud_permitted: [ollama-local]
  - task_class: grounding_check
    local_only: [ollama-local]
    local_preferred: [ollama-local]
    cloud_permitted: [ollama-local]
  - task_class: drafting
    local_only: [mini1-mlx]                    # not registered on this box → refuses
    local_preferred: [mini1-mlx, cloud-x]
    cloud_permitted: [cloud-x, mini1-mlx]
defaults:
  local_only: []
  local_preferred: []
  cloud_permitted: []
