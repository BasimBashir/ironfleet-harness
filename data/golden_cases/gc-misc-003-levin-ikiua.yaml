# cluster: insolvency-general  status: approved
id: gc-misc-003-levin-ikiua
matter_type: insolvency-general
task_class: analysis
prompt: |
  You act for the liquidators of a New Zealand company that contracted with a government agency. Its two directors, who
  control the beneficiary trusts, paid the company's monthly trading profits to those trusts and left nothing in reserve;
  the agency later alleged overpayment and has proved a large debt. The directors say the company held its business
  undertaking on trust for those beneficiaries from when they resolved to trade as a trust, though the settlor never
  transferred anything to it and no resolution records the arrangement. Advise whether the distributions can be recovered
  from the trustees under s 298(2) of the Companies Act 1993, citing the provision, the classic authority on the modes by
  which a settlement of personal property takes effect, and the authority on a trustee's entitlement to be indemnified for
  expenses properly incurred.
expected_citations:
  - "Companies Act 1993, s 298"
  - "Milroy v Lord"
  - "Octavo Investments Pty Ltd v Knight (1979) 27 ALR 129"
required_grounding:
  - "declaration of trust"
  - "right of indemnity"
persona_checks:
  does not apply: "does not apply"
