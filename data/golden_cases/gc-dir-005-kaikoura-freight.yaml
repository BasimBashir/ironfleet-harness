# cluster: directors-duties  status: draft
id: gc-dir-005-kaikoura-freight
matter_type: directors-duties
task_class: analysis
prompt: |
  You act for the liquidators of Kaikoura Haulage Ltd, wound up owing $340,837.01 to
  creditors. Judgment has been entered that its sole director breached s 135 of the Companies
  Act 1993 by reckless trading from 31 October 2012 until cessation, and s 136 by incurring
  obligations he had no reasonable grounds to believe would be met. The director says he
  cannot be made to pay more than a fair share of an unhappy outcome. Advise how the amount
  recoverable from him as compensation under s 301 is assessed, including the requisite causal
  link between the breaches and the creditors' losses, citing the authority on quantifying a
  director's liability for losses caused by reckless trading.
expected_citations:
  - "Companies Act 1993, s 301"
  - "Lower v Traveller [2005] 3 NZLR 479"
required_grounding:
  - "reckless trading"
  - "causal link"
persona_checks:
  compensation: "compensation"
