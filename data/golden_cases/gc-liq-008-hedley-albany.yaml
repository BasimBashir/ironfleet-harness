# citation: Hedley v Albany Power Centre Ltd (in liq) [2006] 2 NZCCLR 1148
# pins: leave application under s 165 treated as a s 284 direction application ([1]-[2],
#       directions under s 284(1)(a) at [67]-[71]); informed shareholders' views decisive -
#       fully informed simple majority against suing concludes the matter ([61]-[64]),
#       majority assessed per s 105(2) with shareholding directors excluded ([65]);
