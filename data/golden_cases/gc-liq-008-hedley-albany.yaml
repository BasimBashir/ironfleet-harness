# cluster: liquidators-duties  status: approved
id: gc-liq-008-hedley-albany
matter_type: liquidators-duties
task_class: analysis
prompt: |
  You act for the liquidators of Albany Retail Ltd. A shareholder whose late husband was a
  former director wants the liquidators sued for breach of duty; she asks you either to sue
  or to seek a direction under s 284 of the Companies Act 1993 compelling the company's
  litigation. Other shareholders have not been told what recovery is realistically available
  or what costs are at risk. Advise how you should proceed before deciding whether to bring
  the proceeding against the directors, citing the statutory routes available.
expected_citations:
  - "Companies Act 1993, s 284"
  - "Companies Act 1993, s 165"
required_grounding:
  - "fully informed"
  - "majority of shareholders"
persona_checks:
  direction: "direction"
