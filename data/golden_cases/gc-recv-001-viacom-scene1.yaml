# cluster: receivership  status: draft
id: gc-recv-001-viacom-scene1
matter_type: receivership
task_class: analysis
prompt: |
  You act for receivers appointed by a trading bank over a New Zealand importer of consumer electronics; the bank is owed
  $7.9m and unsecured creditors $12.4m. The former exclusive licensor, an overseas studio whose supply agreement ended on
  the receivership, says the 640,000 items of warehoused stock infringe its rights. After the High Court discharged its
  injunction on 14 March 2025 it appealed, saying discount selling will permanently damage its brand and its appeal will be
  futile if the stock goes. The receivers will sell now and hold the proceeds in their trust account until the appeal ends,
  while $9,400 a month of warehousing costs accrues. Advise whether the appeal court should preserve the position pending
  appeal, citing the authority setting out the factors for that application and the earlier authority followed on avoiding a
  premature determination of an arguable appeal and on undertakings preserving a just balance.
expected_citations:
  - "Dymocks Franchise Systems (NSW) Pty Ltd v Bilgola Enterprises Ltd (1999) 13 PRNZ 48"
  - "Minnesota Mining & Manufacturing Co v Johnson & Johnson Ltd [1976] RPC 671"
required_grounding:
  - "balance of convenience"
  - "rendered nugatory"
persona_checks:
  dismissed: "dismissed"
