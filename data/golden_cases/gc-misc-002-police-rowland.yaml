# cluster: insolvency-general  status: draft
id: gc-misc-002-police-rowland
matter_type: insolvency-general
task_class: analysis
prompt: |
  You act for the New Zealand Police in High Court proceedings under the Criminal Proceeds (Recovery) Act 2009 against a man
  convicted in 2017 of importing a controlled drug, with an agreed unlawful benefit of $1,320,000, and against his partner.
  She disclaims any interest in his assets, saying he ran them throughout; she keeps only a car registered in her father's
  name, bought for $34,500 with a $21,500 parental loan and the $13,000 trade-in of a car she bought with her own drug
  proceeds. The settlement forfeits to the Crown everything the man owns or controls in satisfaction of that benefit, and she
  pays $13,000 into the proceeds-of-crime account so the car returns to her father, who consents. Advise whether the High Court
  will approve these settlements and on what statutory bases, citing the provision governing approval of a settlement, the
  provision fixing the recoverable amount, and the provision treating property registered in another's name as his.
expected_citations:
  - "Criminal Proceeds (Recovery) Act 2009, s 95"
  - "Criminal Proceeds (Recovery) Act 2009, s 53"
  - "Criminal Proceeds (Recovery) Act 2009, s 58"
required_grounding:
  - "significant criminal activity"
  - "effective control"
persona_checks:
  profit forfeiture order: "profit forfeiture order"
  asset forfeiture order: "asset forfeiture order"
