id: gc-dir-004-nicholson-permakraft
matter_type: directors-duties
task_class: analysis
prompt: |
  You act for the liquidator of a NZ company. While it was of doubtful solvency its
  sole director caused it to pay $48,000 to a finance company in satisfaction of a debt
  owed personally by the director; the company received no consideration. All
  shareholders later assented to the payment informally. Advise whether the director
  is liable to the company in misfeasance, citing the leading NZ authority on directors'
  duties to creditors when a company is insolvent or of doubtful solvency.
expected_citations:
  - "Nicholson v Permakraft (NZ) Ltd [1985] 1 NZLR 242"
  - "Re Duomatic Ltd"
required_grounding:
  - "creditors"
  - "misfeasance"
persona_checks:
  liable: "liable"
