# source: Fisk v Attorney-General (Comptroller of Customs) — [2016] NZHC 479.pdf
# citation: Fisk v Attorney-General (Comptroller of Customs) [2016] NZHC 479
# focus: receivers' s 34 Receiverships Act 1993 direction refused — the s 97(1) Customs and
#        Excise Act 1996 charge outranks an earlier-attaching perfected security interest
# pins: competition for priority over proceeds of sale ([1]-[3]); PPSA s 23(b) puts charges
#       created by other statutes outside the Act ([22]-[23]); central issue statutory
#       interpretation ([26]); s 97(2) power to take possession and sell charged goods even
#       where property has passed to a third party, "in satisfaction or part satisfaction of
#       the charge", no deferral to a security of greater priority ([75], [80]); s 98(2)
#       disapplies Companies Act s 305 / Insolvency Act ss 243-244 in any case to which s 99
#       applies ([76], [78]); s 99(3) power of sale "certain and broad" ([75]); s 99(8)
#       redemption power supports unqualified right ([81]); s 286(1)(dd) and reg 87(1)
#       dispersal/order of priority ([38]-[39], [83], [87]); implied repeal by PPSA s 109
#       rejected ([90]); conclusion — Customs charge takes priority despite earlier
#       attachment ([97], [102]-[103]); Terminals (NZ) Ltd v Comptroller of Customs on
#       purposive construction of taxing statutes ([65], [67], [99]-[100])
# note: the neutral citation "[2013] NZSC 139" for Terminals IS text-derived — fn 21 reads
#       "Terminals (NZ) Ltd v Comptroller of Customs [2013] NZSC 139; [2014] 1 NZLR 121", and the
#       case is cited again by that citation at fn 23. Every other pin in this batch is text-derived.
# real figures (prompt figures fictionalised): declared value $438,272.00; duty/GST
#       $65,892.39; owed Customs $53,521.44; owed BNZ $4,192,000; two $10,000 part-payments;
#       importation 23 February 2014, receivers appointed 2 July 2014
# cluster: receivership  status: draft
id: gc-recv-002-fisk-customs
matter_type: receivership
task_class: analysis
prompt: |
  You act for receivers appointed in August 2015 by a trading bank over a New Zealand printing company that owes the bank
  $3.6m. They have sold a lithographic press the company imported from Germany in May 2015 and hold the proceeds. The
  Comptroller of Customs says unpaid duty and GST of $71,400 on that import, deferred under an approved scheme and unpaid
  when due, is a charge on the press under s 97(1) of the Customs and Excise Act 1996 and must come out of those proceeds,
  even though the bank's security interest attached to the press and was perfected months before importation. The receivers
  apply for directions under s 34 of the Receiverships Act 1993. Advise which claim must be met first out of the proceeds
  and why, citing the provision creating that charge, the Personal Property Securities Act 1999 provision excluding charges
  created by other statutes, and the Supreme Court decision on the purposive construction of taxing statutes.
expected_citations:
  - "Customs and Excise Act 1996, s 97"
  - "Personal Property Securities Act 1999, s 23"
  - "Terminals (NZ) Ltd v Comptroller of Customs [2013] NZSC 139"
required_grounding:
  - "statutory charge"
  - "charge on the goods"
persona_checks:
  priority: "priority"
