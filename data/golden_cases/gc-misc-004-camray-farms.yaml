# source: Camray Farms Ltd (in liq) v BL (Nature Sunshine) Trustee Ltd — [2019] NZHC 2536.pdf
# citation: Camray Farms Ltd (in liq) v BL (Nature Sunshine) Trustee Ltd [2019] NZHC 2536
# pins: trustee's right of indemnity gives an equitable lien protected by caveat ([2]);
#       Octavo Investments Pty Ltd v Knight (1979) 144 CLR 360 and Re Suco Gold on
#       liquidator standing to exercise the indemnity (at [68] fn 16-19); Hardoon v Belilios
#       [1901] AC 118 at 123 on beneficiary subrogation (fn 7); indemnity allowed only for the
#       IRD debt and quantifiable trustee costs ([115]-[117]), not for unrealised "current
#       liabilities"; prior-ranking mortgage held valid as securing loan variation for the
#       company's accommodation ([144]-[149]) so claim dismissed ([150], [152])
# cluster: insolvency-general  status: approved
id: gc-misc-004-camray-farms
matter_type: insolvency-general
task_class: analysis
prompt: |
  You act for the liquidators of Farmtrust Ltd, a former corporate trustee of a family farm
  trust. Sale proceeds of $1.9m are in court. Your liquidators claim priority by way of
  equitable lien under the company's right of indemnity for trust liabilities shown as
  current liabilities in accounts prepared seven years before liquidation, none of whose
  creditors has ever claimed. A prior-ranking mortgagee claims priority over all proceeds.
  Advise whether the right of indemnity can be exercised over those entries and how it
  ranks against the mortgagee, citing the leading authority on the trustee's indemnity.
expected_citations:
  - "Octavo Investments Pty Ltd v Knight (1979) 144 CLR 360"
  - "Hardoon v Belilios [1901] AC 118"
required_grounding:
  - "right of indemnity"
  - "equitable lien"
persona_checks:
  priority: "priority"
